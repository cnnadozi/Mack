<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mack setup</title>
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <h1>Mack setup</h1>
      <p>Enter your temporary Anthropic API key to try Mack on GOV.UK.</p>
      <p>The key stays in this browser session. Enter it again after restarting Chrome or reloading Mack.</p>
      <form id="setup">
        <label for="api-key">Anthropic API key</label>
        <input id="api-key" type="password" autocomplete="off" required />
        <button type="submit">Save for this session</button>
        <button id="forget" type="button">Forget key</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p>After saving, open <a href="https://www.gov.uk/" target="_blank" rel="noreferrer">GOV.UK</a> and click Mack in the browser toolbar.</p>
    </main>
  </body>
</html>
